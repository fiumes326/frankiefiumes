<!DOCTYPE html>
<html>
    <head>
        <title>Frankie Fiumes</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <canvas id="webgl"></canvas>
        <div id="loading"></div>
        <canvas id="minimap"></canvas>
        <button id="expandMiniMap" type="button" aria-label="Expand minimap">
            <img id='expandIcon' src="/icons/expand.png" alt="" />
        </button>
        <div id='toolTip'></div>
        <div id='notification'>
            <span id="notificationMessage"></span>
            <button id="closeNotification" type="button" aria-label="Close notification">X</button>
        </div>
        <div id='mobileControls'>
            <svg viewBox="0 0 100 100">
                <g id="mobileUp">
                    <rect x="35" y="5" width="30" height="30" fill="grey" opacity=".5" stroke="black" stroke-width="5" />
                    <polygon points="50,11 42,23 47,23 47,29 53,29 53,23 58,23" fill="white" />
                </g>
                <g id="mobileLeft">
                    <rect x="5" y="35" width="30" height="30" fill="grey" opacity=".5" stroke="black" stroke-width="5" />
                    <polygon points="11,50 23,42 23,47 29,47 29,53 23,53 23,58" fill="white" />
                </g>
                <g id="mobileRight">
                    <rect x="65" y="35" width="30" height="30" fill="grey" opacity=".5" stroke="black" stroke-width="5" />
                    <polygon points="89,50 77,42 77,47 71,47 71,53 77,53 77,58" fill="white" />
                </g>
                <g id="mobileDown">
                    <rect x="35" y="65" width="30" height="30" fill="grey" opacity=".5" stroke="black" stroke-width="5" />
                    <polygon points="50,89 42,77 47,77 47,71 53,71 53,77 58,77" fill="white" />
                </g>
            </svg>
            <svg viewBox="0 0 50 50">
                <g id="mobileFire">
                    <circle id="mobileRotate" cx="25" cy="25" r="20" fill="red" opacity=".5" stroke="black" stroke-width="5" />
                </g>
            </svg>
        </div>
    </body>
    <script type="module" src="./script.js"></script>
</html>
